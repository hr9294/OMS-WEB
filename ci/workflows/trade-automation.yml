name: OMS Trade Automation & Export Pipeline

on:
  # 1. Manual trigger from GitHub Actions web UI
  workflow_dispatch:
    inputs:
      execution_mode:
        description: 'Trade Execution Mode'
        required: true
        default: 'NORMAL_TRADE'
        type: choice
        options:
          - NORMAL_TRADE
          - TRADE_EXPORT
          - MULTI_ORDER
      runner_type:
        description: 'Runner Environment (windows-latest or self-hosted)'
        required: true
        default: 'windows-latest'
        type: choice
        options:
          - windows-latest
          - self-hosted

  # 2. Automated Trigger from Developer's Repository (when code is pushed or deployed)
  repository_dispatch:
    types: [app_deployed, new_build_deployed, run_tests]

  # 3. Scheduled run for Sunday to Thursday trading days (9:30 AM BD Time = 3:30 AM UTC)
  schedule:
    - cron: '30 3 * * 0-4'

jobs:
  trade-automation:
    name: Execute Trade Engine & Export Files
    runs-on: ${{ inputs.runner_type || github.event.client_payload.runner_type || 'windows-latest' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile Suite with Maven
        run: |
          mvn -B compile
        env:
          MAVEN_OPTS: "-Dfile.encoding=UTF-8"

      - name: Run Automation Engine
        run: |
          $env:CI = "true"
          $env:HEADLESS = "true"

          # Determine execution mode from manual input or dispatch payload
          $mode = "${{ inputs.execution_mode || github.event.client_payload.execution_mode }}"
          if (-not $mode) { $mode = "NORMAL_TRADE" }

          # Check if custom target URL was passed by the developers (e.g. staging or test branch)
          $targetUrl = "${{ github.event.client_payload.target_url }}"
          if ($targetUrl) {
            $env:TARGET_URL = $targetUrl
            Write-Host "[PIPELINE] Target URL configured from Dispatch: $targetUrl"
          }

          Write-Host "[PIPELINE] Trigger Event: ${{ github.event_name }}"
          Write-Host "[PIPELINE] Launching OMS Automation in mode: $mode"
          mvn -B exec:java -Dexec.mainClass="OMSwebmain" -Dexec.args="$mode"
        continue-on-error: true

      - name: Archive Exported Trade Files (XML & CSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oms-trade-files-${{ github.run_id }}
          path: |
            ~/Downloads/*TRADES*.xml
            ~/Downloads/*TRADES*.csv
            ~/Downloads/Trade_Export_*.xml
            ~/Downloads/Trade_Export_*.csv
            *.png
            logs/*.log
          retention-days: 30

      - name: Publish Step Summary
        if: always()
        run: |
          $devCommit = "${{ github.event.client_payload.commit || 'N/A' }}"
          $devAuthor = "${{ github.event.client_payload.author || 'N/A' }}"
          $devRepo   = "${{ github.event.client_payload.repository || 'External App Repo' }}"
          $devEnv    = "${{ github.event.client_payload.environment || 'https://devoms.quantbd.com' }}"

          $summary = @"
          # 📊 OMS Trade Automation & Quality Gate Report
          - **Trigger Event**: `${{ github.event_name }}`
          - **Deployed Environment**: `$devEnv`
          - **Developer Commit**: `$devCommit`
          - **Developer / Author**: `$devAuthor`
          - **Originating Repo**: `$devRepo`
          - **Execution Mode**: `${{ inputs.execution_mode || github.event.client_payload.execution_mode || 'NORMAL_TRADE' }}`
          - **Runner**: `${{ inputs.runner_type || github.event.client_payload.runner_type || 'windows-latest' }}`
          - **Status**: Completed
          - **Artifacts**: Downloaded XML & CSV Trade Files saved to workflow artifacts.
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
