name: OMS Automation CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Compile Verification
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile Suite with Maven
        run: |
          mvn -B clean compile
        env:
          MAVEN_OPTS: "-Dfile.encoding=UTF-8"

      - name: Verify Class Generation
        run: |
          if (-not (Test-Path "target/classes/OMSwebmain.class")) {
            Write-Error "OMSwebmain.class was not generated!"
            exit 1
          }
          Write-Host "[SUCCESS] All 15 Java classes compiled cleanly into target/classes!"
